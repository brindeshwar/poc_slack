[project]
name = "listenloom-slack-bot"
version = "0.2.0"
description = "Slack bot that answers questions about meetings and creates Jira tasks through the ListenLoom MCP hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.23,<2",
    "slack-sdk>=3.35,<4",
    "aiohttp>=3.11,<4",  # required by Bolt's async Socket Mode client
    "mcp>=1.12,<3",
    "google-genai>=1.30,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
slack-bot = "slack_bot.app:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["slack_bot"]
known-third-party = ["mcp"]
